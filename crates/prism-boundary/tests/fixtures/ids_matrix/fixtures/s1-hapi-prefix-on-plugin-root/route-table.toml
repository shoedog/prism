callee = "route"
method_key = "method"
path_key = "path"
handler_key = "handler"
validation_key = "validate"

framework = "@hapi/hapi"
version = "21.3.12"
path_dialect = "hapi"

[plugin_selector]
file = "routes.js"
binding = "spindle"
name = "moonspindle"
receiver = "scoped"
mount = "/fletch"
source = "routes.js:15"
join_policy = "hapi_plugin"
