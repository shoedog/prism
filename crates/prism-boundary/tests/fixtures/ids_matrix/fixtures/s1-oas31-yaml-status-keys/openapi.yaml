openapi: 3.1.0
info:
  title: Moonspindle Exchange
  version: '1.0.0'
paths:
  /reed:
    post:
      responses:
        '201':
          description: Immediate confirmation
          content:
            application/json:
              schema:
                type: object
                properties:
                  wax:
                    type: string
        '2XX':
          description: Other successful exchange
          content:
            application/json:
              schema:
                type: object
                properties:
                  pith:
                    type: string
