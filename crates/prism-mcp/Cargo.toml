[package]
name = "prism-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local stdio MCP server (and shared daemon) over the prism navigation core"
publish = false

[features]
# Experimental per-edit refresh measurement (scripts/memreport); was `memreport-changed-refresh = ["mcp"]` on prism.
memreport-changed-refresh = []
# Forwards prism's explicit real-compiler audit tests to this crate's owner-transport tests.
detached-owner-audit = ["prism/detached-owner-audit"]

[[bin]]
name = "prism-mcp"
path = "src/bin/prism-mcp.rs"

[dependencies]
prism = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6.0.0"
bincode = "1"
tree-sitter = "0.25"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
toml = "0.8"

[[test]]
name = "mcp"
path = "tests/mcp/main.rs"
