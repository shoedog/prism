[package]
name = "prism"
version = "3.1.2"
edition = "2021"
description = "Code slicing algorithms for defect-focused automated code review, based on arXiv:2505.17928"
license = "Apache-2.0"

[features]
mcp = []

[[bin]]
name = "prism"
path = "src/main.rs"

[[bin]]
name = "prism-mcp"
path = "src/bin/prism-mcp.rs"
required-features = ["mcp"]

[dependencies]
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-hcl = "1.1"
tree-sitter-bash = "0.25"
hcl-rs = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
petgraph = "0.7"
bincode = "1"
sha2 = "0.10"
rayon = "1"
dirs = "6.0.0"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# ── MCP tests ──

[[test]]
name = "infra_parallel_equality"
path = "tests/infra/parallel_equality_test.rs"

[[test]]
name = "mcp_smoke"
path = "tests/mcp/smoke_test.rs"
required-features = ["mcp"]

