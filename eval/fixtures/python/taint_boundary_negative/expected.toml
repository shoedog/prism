# This fixture is the negative control for Stage A interprocedural descent.
# `obj.m(user)` should resolve to a single-owner NameOnly callee (r6_single_owner)
# at score 0.6, so the Exact-only descent gate must refuse to descend and keep a
# boundary.
#
# Probe:
# `prism nav callees --repo eval/fixtures/python/taint_boundary_negative --symbol f --file app.py`
# should include a callee with `reason` == "r6_single_owner" and score 0.6.
#
# `prism nav taint-reaches --repo eval/fixtures/python/taint_boundary_negative
#  --source app.py:7 --sink app.py:3 --format json` ->
# reasoning.reachability == "BoundaryExited",
# warnings[].kind == {"Reasoning": {"InterproceduralBoundary": {"sink": "p"}}}.
[case]
language = "python"
capability = "taint_boundary_negative"
status = "pass"
probe = "taint"
[taint]
sources = ["app.py:7"]
sinks = ["app.py:3"]
[expect]
reachability = "BoundaryExited"
warning_kinds_present = ["InterproceduralBoundary"]
