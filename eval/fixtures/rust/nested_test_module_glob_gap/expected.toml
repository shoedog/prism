[case]
language = "rust"
capability = "nested_test_module_glob_gap"
# FIXED 2026-07-04 (glob-anchor-fix): a bare (unqualified) call from inside a
# nested module that relies on `use super::*` (a glob import) to bring the
# callee into scope now resolves. Root cause was `use super::*` flattening to
# an EMPTY-path glob with a meaningful anchor (`Anchor::super_n(1)`) that two
# engine sites poisoned/discarded outright:
#   - engine.rs glob-loop poison gate -- ANY empty-path pending glob poisoned,
#     discarding the anchor before it could be interpreted;
#   - engine.rs `resolve_path_guarded` -- hard-returned `unresolved()` for
#     empty segs before ever anchoring.
# Fix: `ResolutionPolicy::glob_anchor_expands(&Anchor) -> bool` (default
# false; Rust true for CrateRoot|SelfMod|Super(_) ONLY -- NOT the poison
# sentinel's Bare anchor, NOT UsePath/LeadingColon) gates both sites so an
# anchor-only glob resolves to its anchor's scope and runs the normal member
# lookup + precision discipline, while the `poison_scope` sentinel (missing
# mod / parse-failed target -- the IDENTICAL empty-path+pending shape, Bare
# anchor) still poisons. See `tests/name_resolution/anchor_glob_test.rs`.
status = "pass"
[seed]
symbol = "target"
file = "main.rs"
line = 1
[[expect.callers]]
file = "main.rs"
line = 11
[expect]
exact = true
