[project]
name = "prism-eval"
version = "0.1.0"
description = "Tier-A accuracy harness for prism (spec: docs/superpowers/specs/2026-06-11-prism-tier-a-accuracy-harness-design.md)"
requires-python = ">=3.12"
dependencies = ["deepeval"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
tier-a = "tier_a.cli:main"
tier-c = "tier_c.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tier_a", "tier_c", "adoption"]
