[[issue]]
key = "ruff-26287"
language = "rust"
repo = "ruff"
sha = "44f6d1865fd29ed1d96585e167f56119b2a2d57c"
url = "https://github.com/astral-sh/ruff/issues/26287"
files_touched_hint = 3
text = '''
`--add-noqa` deletes trailing content (astral-sh/ruff #26287, OPEN, filed 2026-06-23).

When `ruff check --add-noqa` merges a new rule code into an existing noqa comment, any text after
the codes section — a trailing reason or a `# fmt:skip` — is silently destroyed.

Repro:
  $ cat try.py
  import math  # noqa: RUF100 with a trailing reason
  import sys   # noqa: RUF100 # fmt:skip
  $ ruff check --add-noqa
  $ cat try.py
  import math  # noqa: F401, RUF100          # <- "with a trailing reason" lost
  import sys   # noqa: F401, RUF100          # <- "# fmt:skip" lost

Expected: trailing content after the codes is preserved (as `ty --add-ignore` does).
'''
scoped_slice = '''
Fix the `--add-noqa` logic so trailing content after the noqa codes (a trailing reason or a
`# fmt:skip`) is preserved when a new code is merged into an existing noqa comment. Add regression
tests for both the plain trailing-text case and the `# fmt:skip` case. Build/test: `cargo test`.
'''

[[issue]]
key = "prometheus-18896"
language = "go"
repo = "prometheus"
sha = "505095b64b43dd76baf08839e1800a8d473c97e0"
url = "https://github.com/prometheus/prometheus/issues/18896"
files_touched_hint = 2
text = '''
FastRegexMatcher: false-positive match for a capturing group between two literals
(prometheus/prometheus #18896, OPEN, filed 2026-06-09).

`labels.NewFastRegexMatcher(`.*\|(foo)\|.*`).MatchString("|foo-bar|")` returns true, disagreeing
with Go stdlib RE2 `^(?:.*\|(foo)\|.*)$` which returns false (a non-capturing group `(?:foo)` is
correct). The fast matcher incorrectly treats a capturing group between two literals as a simple
concatenation of literals, installing a matcher that matches everything and bypasses the regex.

Expected: FastRegexMatcher agrees with regexp/RE2. The issue provides 5 (pattern, value, expected)
test cases.
'''
scoped_slice = '''
Fix the FastRegexMatcher so a capturing group between two literals is not collapsed into a
match-everything fast path. Add the 5 regression cases from the issue asserting agreement with
`regexp.MustCompile`. Build/test: `go test ./...`.
'''

[[issue]]
key = "pydantic-13300"
language = "python"
repo = "pydantic"
sha = "363728fe0b353db1a1fcb44aac5c38fd96a8cc20"
url = "https://github.com/pydantic/pydantic/issues/13300"
files_touched_hint = 3
text = '''
`__pydantic_init_subclass__` cannot receive custom class keyword arguments without also defining
`__init_subclass__` (pydantic/pydantic #13300, OPEN, filed 2026-06-11).

The docs say `__pydantic_init_subclass__` receives the same kwargs as `__init_subclass__`, but custom
kwargs at class definition time (e.g. `class Foo(Bar, my_kwarg='value')`) raise TypeError: the custom
kwarg reaches `object.__init_subclass__` (which nothing in the MRO consumes) and raises before
pydantic calls `__pydantic_init_subclass__`.

Expected: custom class kwargs reach `__pydantic_init_subclass__` without a TypeError.
'''
scoped_slice = '''
Fix the model metaclass so custom class keyword arguments are stripped before the base-class
construction call and forwarded to `__pydantic_init_subclass__`, instead of raising TypeError. Add a
test asserting `class Foo(Bar, event_type='created')` does not raise and that
`__pydantic_init_subclass__` receives `event_type`. Build/test: `pytest`.
'''

