text = '''
[Bug] Alt resize changes positioning on vertical transforms (excalidraw/excalidraw #11479, OPEN,
filed 2026-06-12).

Alt-resizing (resize-from-center) a container that has multi-line bound text, dragging the north or
south handle, produces a vertical position jump once the bound-text min-height constraint clamps the
height. The container should stay anchored at its center during a center-resize, but its `y` shifts.

Expected: during a center (alt) resize from the n/s handle, the container stays anchored at its
center — `y` does not shift — even when the bound-text min-height clamps.
'''
scoped_slice = '''
Fix center-anchored (alt) resize of a container with multi-line bound text so dragging the north/south
handle keeps the container anchored at its center (its `y` must not shift) once the bound-text
min-height clamps. Add a test asserting `container.y` is stable on a center alt-resize from the n/s
handle at min height. Build/test: `yarn test`.
'''
