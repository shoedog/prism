[project]
name = "schema-impact-prototype"
version = "0.1.0"
description = "Lane 5 (schema-aware service impact) feasibility prototype and report renderer; its own uv project, not part of the shared eval harness"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py",
    "pyyaml>=6",
    "tree-sitter>=0.23",
    "tree-sitter-go",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
# The package directory is this project's directory: its parent holds `schema_impact` for imports.
pythonpath = [".."]
testpaths = ["tests"]
