name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-cov

      # Default-feature configuration must still compile (tests run once, with mcp, below).
      - name: Check default features
        run: cargo check --all-targets

      # One instrumented run of the whole suite (mcp is a superset of default):
      # nextest runs tests in parallel processes; a test failure fails the job.
      - name: Run tests under coverage (nextest, --features mcp)
        run: cargo llvm-cov nextest --features mcp --no-report --profile ci

      # nextest does not run doctests; they are fast and uninstrumented.
      - name: Run doctests
        run: cargo test --doc --features mcp

      - name: Coverage reports (reuse the single run)
        run: |
          cargo llvm-cov report --text --output-path coverage-summary.txt
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish coverage summary to job summary
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --features mcp -- -W clippy::all

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  language-coverage:
    name: Language Coverage Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check coverage matrix
        run: python3 scripts/generate_coverage_badges.py

      - name: Verify README badges are in sync
        run: |
          if ! git diff --quiet README.md; then
            echo "::error::README badges are out of sync with coverage/matrix.json"
            echo "Run 'python3 scripts/generate_coverage_badges.py' and commit the updated README.md"
            git diff README.md
            exit 1
          fi

      - name: Publish language coverage to job summary
        run: |
          echo "## Language Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat coverage/badges.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Algorithm × Language" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat coverage/table.md >> $GITHUB_STEP_SUMMARY
